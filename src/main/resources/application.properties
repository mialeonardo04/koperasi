# ============================================================
# Koperasi Leyangan - application.properties
# OS: Windows 11
# ============================================================

# ?? Aplikasi ??????????????????????????????????????????????????
spring.application.name=koperasi-app

# ?? Database PostgreSQL ???????????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5516/koperasi
spring.datasource.username=koperasi
spring.datasource.password=k0peras1
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ?? JPA / Hibernate ???????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ?? Flyway ????????????????????????????????????????????????????
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# ?? Server ????????????????????????????????????????????????????
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/api

# ?? File Upload (multipart) ???????????????????????????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ?? JWT ???????????????????????????????????????????????????????
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000
app.jwt.refresh-token.expiration=604800000

# ?? Upload Bukti Pembayaran ???????????????????????????????????
# Path penyimpanan file di Windows ? pakai forward slash atau double backslash
# Sesuaikan dengan lokasi project Anda:
#   Jika project ada di D:\koperasi\koperasi  ?  D:/koperasi/uploads/bukti-bayar
#   Jika project ada di C:\project\koperasi   ?  C:/project/uploads/bukti-bayar
app.upload.dir=D:/koperasi/uploads/bukti-bayar
app.upload.max-size-mb=1

# ?? Logging ???????????????????????????????????????????????????
logging.level.com.koperasi=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO

