# ============================================================
# Koperasi Leyangan - application.properties
# OS: Windows 11
# ============================================================

# -- Aplikasi
spring.application.name=koperasi-app

# -- Database PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5516/koperasi}
spring.datasource.username=${DB_USERNAME:koperasi}
spring.datasource.password=${DB_PASSWORD:k0peras1}
spring.datasource.driver-class-name=org.postgresql.Driver

# -- JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -- Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# -- Server
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/api

# -- File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# -- JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=86400000
app.jwt.refresh-token.expiration=604800000

# -- Upload Dir
app.upload.dir=${UPLOAD_DIR:D:/koperasi/uploads/bukti-bayar}
app.upload.max-size-mb=1

# -- Logging
logging.level.com.koperasi=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO

# -- Telegram Bot
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:GANTI_TOKEN_BOT}
app.telegram.admin-chat-id=${TELEGRAM_ADMIN_CHAT_ID:436703107}

# -- AI Chatbot Groq
groq.api.key=${GROQ_API_KEY:GANTI_GROQ_KEY}

# -- HikariCP (tuned for koperasi scale)
spring.datasource.hikari.pool-name=KoperasiPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# -- Cache
spring.cache.type=simple

